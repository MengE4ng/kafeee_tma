<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Kafee</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito+Sans:wght@400;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="/logo.webp" />
<style>
  /* Palette taken from the Kafee logo and menu board */
  :root {
    --paper: #f4ead3;
    --paper-2: #ebdcbc;
    --ink: #1b1410;
    --mustard: #c9a12b;
    --espresso: #4b2e17;
    --matcha: #8db255;
    --steel: #b9bec3;
    --red: #c8352b;
    --khqr-red: #e1232e;
    --ok: #3f8f3a;
    --muted: #6e5a46;
    --display: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
    --body: 'Nunito', -apple-system, 'Segoe UI', Roboto, 'Noto Sans Khmer', sans-serif;
    --line: 2.5px solid var(--ink);
    --pop: cubic-bezier(.2, 1.5, .4, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; } /* no double-tap zoom */
  body.locked { position: fixed; left: 0; right: 0; overflow: hidden; } /* background frozen while a sheet is open */
  html, body { margin: 0; color: var(--ink); font: 600 16px/1.4 var(--body); background: var(--paper); }
  body {
    min-height: 100vh;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    /* faint spray-paint speckle, a nod to the graffiti menu board */
    background-image:
      radial-gradient(circle at 12% 8%, rgba(201,161,43,.18), transparent 32%),
      radial-gradient(circle at 92% 30%, rgba(141,178,85,.14), transparent 30%),
      radial-gradient(circle at 20% 85%, rgba(75,46,23,.10), transparent 35%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  .hidden { display: none !important; }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: .5px; }

  /* ---------- View transitions ---------- */
  #app.enter-fwd { animation: inFwd .32s cubic-bezier(.2,.8,.2,1); }
  #app.enter-back { animation: inBack .32s cubic-bezier(.2,.8,.2,1); }
  #app.enter-up { animation: inUp .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes inFwd { from { transform: translateX(40px); opacity: 0; } }
  @keyframes inBack { from { transform: translateX(-40px); opacity: 0; } }
  @keyframes inUp { from { transform: translateY(30px); opacity: 0; } }

  /* ---------- Splash ---------- */
  .splash { min-height: 90vh; display: grid; place-items: center; align-content: center; gap: 10px; }
  .splash img { width: 58%; max-width: 240px; animation: drop .7s var(--pop) both; }
  .splash p { margin: 0; font: 22px var(--display); color: var(--espresso); animation: fade .4s .4s both; }
  @keyframes drop { from { transform: translateY(-40px) rotate(-12deg) scale(.6); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- Menu header ---------- */
  .hero { padding: 18px 16px 0; text-align: center; }
  .hero img { width: 62%; max-width: 260px; display: block; margin: 0 auto; transform: rotate(-3deg);
    filter: drop-shadow(4px 5px 0 rgba(27,20,16,.25)); cursor: pointer; }
  .hero img.intro { animation: drop .7s var(--pop) both; }
  .hero img.wiggle { animation: wiggle .5s ease; }
  @keyframes wiggle { 25% { transform: rotate(4deg) scale(1.04); } 50% { transform: rotate(-7deg); } 75% { transform: rotate(1deg); } }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 5px 12px;
    border: var(--line); border-radius: 999px; background: #fff; font-size: 14px; font-weight: 800; }
  .status-pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .status-pill.closed i { background: var(--red); }
  .menu-label { display: inline-block; margin: 16px 0 4px; padding: 6px 22px 2px; transform: rotate(-2deg);
    background: var(--espresso); color: var(--paper); font: 40px/1 var(--display); letter-spacing: 2px;
    clip-path: polygon(2% 8%, 98% 0, 100% 88%, 96% 100%, 3% 95%, 0 20%); }

  /* sticky bar with tabs; a mini logo slides in once the big one scrolls away */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--paper); border-bottom: 2.5px solid transparent; transition: border-color .2s; }
  .bar.stuck { border-bottom-color: var(--ink); }
  .bar .mini { width: 0; opacity: 0; transition: width .25s, opacity .25s, margin .25s; height: 36px; object-fit: contain; margin-right: -8px; }
  .bar.stuck .mini { width: 32px; opacity: 1; margin-right: 0; }
  .tab { flex: none; padding: 7px 16px 4px; border: var(--line); border-radius: 12px; background: #fff;
    font: 18px var(--display); letter-spacing: .5px; transition: transform .15s, background .15s, box-shadow .15s; }
  .tab[aria-selected="true"] { background: var(--mustard); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
  .tab:active { transform: translate(2px, 2px); box-shadow: none; }

  /* ---------- Menu board ---------- */
  .board { margin: 6px 14px 0; padding: 4px 14px 10px; background: #fffaf0; border: var(--line);
    border-radius: 6px; box-shadow: 5px 5px 0 var(--ink); }
  .cat-title { margin: 14px 0 2px; font: 22px var(--display); color: var(--espresso); scroll-margin-top: 70px; }
  .cat-title.matcha { color: #5d7f2c; }
  .row { display: grid; grid-template-columns: 50px 1fr; gap: 0 12px; align-items: center; width: 100%;
    padding: 10px 0; text-align: left; position: relative; transition: transform .12s; }
  .row:active { transform: scale(.98); }
  .row[disabled] { opacity: .4; }
  .row.stagger { animation: rowIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rowIn { from { transform: translateX(-18px); opacity: 0; } }
  .ico { grid-row: span 2; width: 50px; height: 50px; border: var(--line); border-radius: 50%; background: #fff;
    display: grid; place-items: center; font-size: 26px; position: relative; }
  .ico.coffee { background: #f1e2c8; } .ico.matcha { background: #e3eccd; }
  .badge { position: absolute; top: -6px; right: -8px; min-width: 22px; height: 22px; padding: 2px 5px 0;
    border: 2px solid var(--ink); border-radius: 11px; background: var(--mustard);
    font: 14px/16px var(--display); display: grid; place-items: center; }
  .badge.pop { animation: badgePop .45s var(--pop); }
  @keyframes badgePop { from { transform: scale(0); } 60% { transform: scale(1.35); } }
  .line { display: flex; align-items: baseline; font: 21px/1.1 var(--display); letter-spacing: .3px; min-width: 0; }
  .line .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .dots { flex: 1; min-width: 14px; border-bottom: 3px dotted var(--ink); margin: 0 6px 5px; opacity: .55; }
  .line .pr { flex: none; }
  .row .desc { font-size: 14px; color: var(--muted); }
  .plus-one { position: absolute; right: 4px; top: 4px; font: 20px var(--display); color: var(--espresso);
    pointer-events: none; animation: floatUp .7s ease-out forwards; }
  @keyframes floatUp { to { transform: translateY(-26px); opacity: 0; } }
  .oz { display: flex; justify-content: center; margin: 22px 0 6px; }
  .oz span { padding: 8px 18px 4px; background: var(--espresso); color: var(--paper); border-radius: 10px;
    font: 18px var(--display); letter-spacing: 1px; transform: rotate(1.5deg); }
  .closed-note { margin: 12px 14px 0; padding: 10px 14px; border: var(--line); border-radius: 10px; background: #fff; font-size: 15px; }

  /* ---------- Item sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(27,20,16,.45); z-index: 20; opacity: 0; transition: opacity .25s; }
  .scrim.show { opacity: 1; }
  .scrim { touch-action: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper);
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    border-top: var(--line); border-radius: 22px 22px 0 0;
    padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .38s cubic-bezier(.2,1.15,.4,1); }
  .sheet.show { transform: none; }
  .grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .3; margin: 0 auto 6px; }
  .sheet-hero { position: relative; display: grid; place-items: center; height: 140px; }
  .sheet-hero svg { position: absolute; width: 150px; height: 150px; animation: burstIn .5s var(--pop) both; }
  .sheet-hero .big { position: relative; font-size: 62px; animation: drop .55s .08s var(--pop) both; }
  @keyframes burstIn { from { transform: scale(0) rotate(-40deg); } }
  .sheet h2 { margin: 2px 0 0; text-align: center; font: 32px/1 var(--display); letter-spacing: .5px; }
  .sheet .sub { text-align: center; color: var(--muted); margin-top: 4px; }
  .opt-group { margin-top: 16px; transition: opacity .2s; }
  .opt-group h3 { margin: 0 0 8px; font: 18px var(--display); letter-spacing: .5px; color: var(--espresso); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border: var(--line); border-radius: 12px; background: #fff; font-weight: 800; font-size: 15px;
    transition: transform .15s, box-shadow .15s, background .15s; }
  .chip[aria-pressed="true"] { background: var(--mustard); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px,-1px); }
  .chip:active { transform: translate(2px,2px); box-shadow: none; }
  .qty-line { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .qty-line strong { font: 18px var(--display); color: var(--espresso); }
  .stepper { display: inline-flex; align-items: center; border: var(--line); border-radius: 12px; background: #fff; }
  .stepper button { width: 40px; height: 38px; font: 22px var(--display); }
  .stepper span { min-width: 26px; text-align: center; font: 20px var(--display); }
  .stepper span.bump { animation: bump .25s var(--pop); }
  @keyframes bump { 50% { transform: scale(1.4); } }

  /* ---------- Buttons ---------- */
  .btn { display: block; width: 100%; padding: 13px 14px 9px; border: var(--line); border-radius: 14px; background: #fff;
    font: 20px var(--display); letter-spacing: .5px; text-align: center; box-shadow: 4px 4px 0 var(--ink);
    transition: transform .1s, box-shadow .1s; }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.primary { background: var(--mustard); }
  .btn.dark { background: var(--espresso); color: var(--paper); }
  .btn.ghost { border: 0; box-shadow: none; background: none; color: var(--red); font-size: 17px; }

  /* ---------- Cart ---------- */
  .page-title { margin: 22px 16px 14px; font: 40px/1 var(--display); letter-spacing: .5px; transform: rotate(-1.5deg); }
  .cart-line { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
  .cart-line + .cart-line { border-top: 2px dashed rgba(27,20,16,.25); }
  .cart-line.out { animation: out .25s ease-in forwards; }
  @keyframes out { to { transform: translateX(60px); opacity: 0; } }
  .cart-line .nm { font: 19px/1.1 var(--display); }
  .cart-line .opts { font-size: 13px; color: var(--muted); }
  .cart-line .pr { font: 17px var(--display); margin-top: 2px; }
  .note { display: block; width: calc(100% - 28px); margin: 18px 14px 0; padding: 12px; min-height: 74px; resize: none;
    border: var(--line); border-radius: 10px; background: #fffaf0; color: var(--ink); font: 600 16px var(--body); }
  .note::placeholder { color: #a08b74; }
  .total-line { display: flex; justify-content: space-between; margin: 20px 18px 0; font: 28px var(--display); }
  .empty { text-align: center; padding: 50px 24px; color: var(--muted); }
  .empty img { width: 140px; transform: rotate(-6deg); opacity: .9; }
  .actions { padding: 18px 14px 0; display: grid; gap: 12px; }

  /* ---------- KHQR ---------- */
  .pay-wrap { padding: 18px 16px; display: flex; flex-direction: column; align-items: center; }
  /* Laid out after the NBC KHQR guideline: 20:29 white card, red header with the
     folded corner, merchant name, bold amount + currency, dashed divider, QR with
     currency mark in the centre. Sizes scale with the card (cqw) so proportions hold. */
  .khqr-stage { width: 100%; max-width: 300px; container-type: inline-size; animation: cardIn .55s var(--pop) both; }
  .khqr { position: relative; width: 100%; aspect-ratio: 20 / 29; background: #fff; color: #000;
    border-radius: 6.5cqw; overflow: hidden; box-shadow: 0 0 6cqw rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
    font-family: 'Nunito Sans', 'Nunito', -apple-system, sans-serif; display: flex; flex-direction: column; }
  @keyframes cardIn { from { transform: translateY(30px) rotate(-4deg) scale(.92); opacity: 0; } }
  .khqr-top { position: relative; flex: none; height: 12%; background: var(--khqr-red);
    display: grid; place-items: center; }
  .khqr-top::after { content: ''; position: absolute; right: 0; top: 100%;
    border-left: 8cqw solid transparent; border-top: 8cqw solid var(--khqr-red); }
  .khqr-top img { height: 40%; width: auto; display: block; }
  .khqr-top .khqr-word { color: #fff; font: 800 7.5cqw/1 'Nunito Sans', 'Nunito', sans-serif; letter-spacing: .3cqw; }
  .khqr-info { padding: 7cqw 10cqw 0; }
  .khqr-name { font-size: 4.6cqw; line-height: 1.3; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .khqr-amount { margin-top: 1cqw; font-size: 9.5cqw; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .khqr-amount small { font-size: 4.6cqw; font-weight: 400; margin-left: 1.5cqw; }
  .khqr-sep { margin: 6.5cqw 0 0; border-top: .6cqw dashed rgba(0,0,0,.45); }
  .khqr-qr { flex: 1; display: grid; place-items: center; padding: 6cqw 10cqw 9cqw; }
  .khqr-qr .q { position: relative; width: 100%; aspect-ratio: 1; }
  .khqr-qr img.code { display: block; width: 100%; height: 100%; image-rendering: pixelated; transition: opacity .3s, filter .3s; }
  .khqr-qr .mark { position: absolute; left: 50%; top: 50%; width: 15%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #000; color: #fff; box-shadow: 0 0 0 1.4cqw #fff;
    display: grid; place-items: center; font: 800 6.5cqw/1 'Nunito Sans', 'Nunito', 'Noto Sans Khmer', sans-serif; }
  .khqr.expired img.code, .khqr.expired .mark { opacity: .12; filter: blur(2px); }
  .khqr-expired-label { position: absolute; left: 0; right: 0; bottom: 34%; text-align: center; font-weight: 800;
    font-size: 5cqw; color: var(--khqr-red); display: none; }
  .khqr.expired .khqr-expired-label { display: block; }
  /* manual payment (your own static merchant QR) */
  .khqr.static .khqr-info { text-align: center; padding-top: 8cqw; }
  .khqr.static .khqr-name { font-size: 5cqw; letter-spacing: .2cqw; }
  .pay-amount { text-align: center; margin: 4px 0 16px; }
  .pay-amount .lbl { font: 20px var(--display); color: var(--espresso); letter-spacing: .5px; }
  .pay-amount .big { display: inline-flex; align-items: baseline; gap: 10px; font: 68px/1 var(--display); color: var(--mustard);
    -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
  .pay-amount .copy { margin-top: 8px; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: #fff;
    font-weight: 800; font-size: 13px; }
  .pay-steps { list-style: none; counter-reset: s; width: 100%; max-width: 320px; margin: 18px 0 0; padding: 12px 16px;
    background: #fffaf0; border: var(--line); border-radius: 10px; }
  .pay-steps li { counter-increment: s; display: flex; gap: 10px; align-items: center; padding: 6px 0; font-weight: 800; font-size: 15px; }
  .pay-steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--espresso);
    color: var(--paper); display: grid; place-items: center; font: 14px/1 var(--display); padding-top: 2px; }
  .warn { width: 100%; max-width: 320px; margin: 0 0 16px; padding: 12px 14px; border: var(--line); border-radius: 12px;
    background: #ffe9a8; font-weight: 800; font-size: 15px; animation: drop .45s var(--pop) both; }
  .checking { text-align: center; padding: 40px 20px 0; }
  .checking img { width: 150px; animation: brew 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .checking h2 { margin: 18px 0 6px; font: 32px/1 var(--display); letter-spacing: .5px; }
  .checking p { margin: 0 auto; max-width: 300px; color: var(--muted); }
  .checking .amt { display: inline-block; margin-top: 18px; padding: 8px 18px 4px; background: var(--espresso); color: var(--paper);
    border-radius: 10px; font: 24px var(--display); }
  .timer { margin-top: 16px; font: 20px var(--display); color: var(--espresso); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .waiting { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-weight: 800; color: var(--muted); }
  .waiting img { width: 34px; animation: brew 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes brew { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .pay-actions { width: 100%; max-width: 320px; margin-top: 18px; display: grid; gap: 12px; }
  .hint { max-width: 320px; text-align: center; color: var(--muted); font-size: 14px; margin: 16px auto 0; }

  /* ---------- Pickup ticket: the big moment ---------- */
  .ticket-wrap { position: relative; display: grid; place-items: center; margin: 18px 0 0; height: 290px; }
  .ticket-wrap svg { position: absolute; width: 300px; height: 300px; }
  .ticket-wrap.pop svg { animation: burstIn .6s var(--pop) both; }
  .ticket-wrap.pop .ticket { animation: drop .6s .15s var(--pop) both; }
  .ticket-wrap svg.spin { animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ticket { position: relative; text-align: center; color: var(--paper); }
  .ticket .label { font: 20px var(--display); letter-spacing: 1px; color: var(--mustard); }
  .ticket .code { font: 104px/.9 var(--display); letter-spacing: 2px; color: var(--mustard);
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink); }
  .ticket .sub { margin-top: 6px; font-weight: 800; font-size: 15px; }
  .ready-banner { margin: 6px 16px 0; padding: 10px 14px 6px; text-align: center; background: var(--matcha);
    border: var(--line); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); font: 22px var(--display);
    animation: drop .5s var(--pop) both; }
  .steps { list-style: none; margin: 16px 14px 0; padding: 6px 16px; background: #fffaf0; border: var(--line);
    border-radius: 10px; box-shadow: 4px 4px 0 var(--ink); }
  .steps li { display: flex; gap: 12px; align-items: center; padding: 11px 0; color: #9c8a77; font-weight: 800; }
  .steps li + li { border-top: 2px dashed rgba(27,20,16,.18); }
  .steps .mark { width: 26px; height: 26px; border-radius: 50%; border: var(--line); flex: none; display: grid; place-items: center;
    background: #fff; font: 14px var(--display); color: #fff; transition: background .3s; }
  .steps li.done, .steps li.now { color: var(--ink); }
  .steps li.done .mark { background: var(--ok); }
  .steps li.done.fresh .mark { animation: badgePop .45s var(--pop); }
  .steps li.now .mark::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--mustard); animation: blink 1.2s infinite; }
  .receipt { margin: 18px 14px 0; padding: 12px 16px; background: #fffaf0; border: var(--line); border-radius: 10px; font-size: 15px; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .receipt small { color: var(--muted); }
  .receipt .t { border-top: 2px dashed rgba(27,20,16,.25); margin-top: 6px; padding-top: 8px; font: 18px var(--display); }

  /* ---------- Find us / help ---------- */
  .visit { margin: 22px 14px 0; padding: 14px 16px 16px; background: #fffaf0; border: var(--line); border-radius: 6px;
    box-shadow: 5px 5px 0 var(--ink); }
  .visit h2 { margin: 0 0 10px; font: 26px/1 var(--display); letter-spacing: .5px; }
  .hours { display: grid; grid-template-columns: auto 1fr; gap: 3px 18px; font-size: 15px; color: var(--muted); }
  .hours .today { color: var(--ink); font-weight: 800; }
  .addr { margin: 12px 0 0; font-weight: 800; }
  .map { position: relative; display: block; width: 100%; margin-top: 12px; height: 170px; border: var(--line);
    border-radius: 10px; overflow: hidden; background: var(--paper-2); padding: 0; }
  .map iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .map span { position: absolute; right: 8px; bottom: 8px; padding: 5px 10px 3px; border-radius: 8px; background: var(--ink);
    color: var(--paper); font: 14px var(--display); letter-spacing: .5px; }
  .contact-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; margin-top: 14px; }
  .contact-row .btn { padding: 10px 6px 7px; font-size: 16px; box-shadow: 3px 3px 0 var(--ink); }
  .help-link { display: block; margin: 16px auto 0; padding: 6px; color: var(--espresso); font-weight: 800; text-decoration: underline; }
  .panel-title { margin: 4px 0 2px; text-align: center; font: 32px/1 var(--display); letter-spacing: .5px; }
  .panel-sub { text-align: center; color: var(--muted); margin: 0; }
  .panel-h3 { margin: 22px 0 0; font: 18px var(--display); letter-spacing: .5px; color: var(--espresso); }
  .sheet .note { width: 100%; margin: 8px 0 0; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    padding: 12px 14px; border: var(--line); border-radius: 12px; background: var(--ink); color: var(--paper);
    font-weight: 800; font-size: 15px; transform: translateY(160%); transition: transform .35s var(--pop); }
  .toast.show { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app"><div class="splash"><img src="/logo.webp" alt="Kafee" /><p>Brewing the menu…</p></div></main>
<div id="scrim" class="scrim hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>
<div id="toast" class="toast" role="status"></div>

<script>
const tg = window.Telegram?.WebApp;
const BRAND = { paper: '#f4ead3', espresso: '#4b2e17', mustard: '#c9a12b', ink: '#1b1410' };
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor(BRAND.paper); tg.setBackgroundColor(BRAND.paper); tg.setBottomBarColor?.(BRAND.paper); } catch {}
}

// No pinch / double-tap zoom (iOS ignores user-scalable=no, so block the gestures too)
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
try { tg?.disableVerticalSwipes?.(); } catch {} // swiping inside a sheet won't close the mini app

// Freeze the page behind a sheet so only the sheet scrolls
let lockedY = 0;
function lockScroll() {
  if (document.body.classList.contains('locked')) return;
  lockedY = window.scrollY;
  document.body.style.top = `-${lockedY}px`;
  document.body.classList.add('locked');
}
function unlockScroll() {
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, lockedY);
}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const haptic = (t) => { try { t === 'tap' ? tg.HapticFeedback.selectionChanged() : ['light','medium','heavy'].includes(t) ? tg.HapticFeedback.impactOccurred(t) : tg.HapticFeedback.notificationOccurred(t); } catch {} };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const state = { menu: null, cart: [], note: '', order: null, view: null, firstMenu: true };
let pollTimer = null, tickTimer = null, stickObserver = null, sheetHideTimer = null;

// Comic starburst, the same shape as the logo's background
function burst(fill, points = 16, stroke = BRAND.ink) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 ? 36 + (i % 4 === 1 ? 4 : 0) : 50;
    const a = (Math.PI * i) / points;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
  }
  return `<svg viewBox="-4 -4 108 108" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'tma ' + (tg?.initData || ''), ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'No connection. Check your internet and try again.');
  return data;
}

// ---------- Money ----------
const minor = (v) => Math.round(v * (state.menu.currency === 'USD' ? 100 : 1));
const fmt = (m) => state.menu.currency === 'USD' ? '$' + (m / 100).toFixed(2) : m.toLocaleString('en-US') + '៛';

// ---------- Telegram buttons ----------
let mainHandler = null, backHandler = null;
function mainButton(text, onClick, { enabled = true } = {}) {
  if (!tg) return;
  if (mainHandler) tg.MainButton.offClick(mainHandler);
  if (!text) { tg.MainButton.hide(); mainHandler = null; return; }
  mainHandler = onClick;
  tg.MainButton.setParams({ text, is_active: enabled, is_visible: true, color: enabled ? BRAND.espresso : '#9c8a77', text_color: BRAND.paper });
  tg.MainButton.onClick(mainHandler);
}
function backButton(onClick) {
  if (!tg) return;
  if (backHandler) tg.BackButton.offClick(backHandler);
  backHandler = onClick || null;
  if (onClick) { tg.BackButton.onClick(onClick); tg.BackButton.show(); } else tg.BackButton.hide();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}
function stopTimers() { clearInterval(pollTimer); clearInterval(tickTimer); pollTimer = tickTimer = null; stickObserver?.disconnect(); }

// ---------- Cart helpers ----------
const itemById = (id) => state.menu.items.find((i) => i.id === id);
const activeGroups = (item, opts) => item.options.filter((g) => !(g === 'ice' && opts.temp === 'hot'));
function unitPrice(item, opts) {
  return activeGroups(item, opts).reduce((p, g) => {
    const c = state.menu.optionGroups[g].choices.find((c) => c.id === opts[g]);
    return p + minor(c?.add || 0);
  }, minor(item.price));
}
function optionSummary(item, opts) {
  return activeGroups(item, opts).map((g) => {
    const c = state.menu.optionGroups[g].choices.find((c) => c.id === opts[g]);
    return c ? (c.summary || c.label) : '';
  }).filter(Boolean).join(', ');
}
const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
const cartTotal = () => state.cart.reduce((s, l) => s + unitPrice(itemById(l.id), l.options) * l.qty, 0);
function addToCart(id, opts, qty) {
  const clean = Object.fromEntries(activeGroups(itemById(id), opts).map((g) => [g, opts[g]]));
  const key = id + '|' + JSON.stringify(clean);
  const existing = state.cart.find((l) => l.key === key);
  existing ? existing.qty += qty : state.cart.push({ key, id, options: clean, qty });
}
const catClass = (cat) => cat.toLowerCase().includes('matcha') ? 'matcha' : 'coffee';

// ---------- Routing with transitions ----------
const ORDER = { menu: 0, cart: 1, pay: 2, status: 3 };
function go(view, dir) {
  const from = state.view;
  dir = dir || (from == null ? 'up' : ORDER[view] >= ORDER[from] ? 'fwd' : 'back');
  state.view = view; stopTimers();
  // leaving the screen closes any open sheet and unfreezes the page
  if (document.body.classList.contains('locked')) {
    unlockScroll(); clearTimeout(sheetHideTimer);
    ['#sheet', '#scrim'].forEach((q) => { $(q).classList.remove('show'); $(q).classList.add('hidden'); });
  }
  const run = () => {
    render();
    window.scrollTo(0, 0);
    const app = $('#app');
    app.classList.remove('enter-fwd', 'enter-back', 'enter-up');
    void app.offsetWidth;
    if (!reduceMotion) app.classList.add('enter-' + dir);
  };
  run();
}
function render() { ({ menu: renderMenu, cart: renderCart, pay: renderPay, status: renderStatus })[state.view](); }

// ---------- Menu ----------
function renderMenu() {
  const m = state.menu;
  const inCart = (id) => state.cart.filter((l) => l.id === id).reduce((s, l) => s + l.qty, 0);
  const intro = state.firstMenu && !reduceMotion;
  let rowIndex = 0;
  $('#app').innerHTML = `
    <header class="hero">
      <img src="/logo.webp" alt="Kafee" class="${intro ? 'intro' : ''}" id="logo" width="260" height="329" />
      <div class="status-pill ${m.open ? '' : 'closed'}"><i></i>${m.open ? (m.closesAt ? `Open now · until ${m.closesAt}` : 'Open now · order ahead') : (m.opensAt ? `Closed · opens ${m.opensAt}` : 'Closed right now')}</div>
      <div><span class="menu-label">MENU</span></div>
    </header>
    ${m.open ? '' : `<div class="closed-note">${m.opensAt ? `We’re closed now. Browse the menu, and order when we open ${esc(m.opensAt)}.` : 'You can look at the menu, but ordering opens when we do.'}</div>`}
    <nav class="bar" id="bar" role="tablist">
      <img class="mini" src="/logo-small.webp" alt="" />
      ${m.categories.map((c, i) => `<button class="tab" role="tab" aria-selected="${i === 0}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
    </nav>
    <div class="board">
      ${m.categories.map((c) => `
        <h2 class="cat-title ${catClass(c)}" id="cat-${esc(c)}">${esc(c)}</h2>
        ${m.items.filter((i) => i.category === c).map((i) => {
          const n = inCart(i.id);
          return `<button class="row ${intro ? 'stagger' : ''}" style="animation-delay:${intro ? 350 + rowIndex++ * 60 : 0}ms" data-item="${i.id}" ${i.soldOut ? 'disabled' : ''}>
            <span class="ico ${catClass(i.category)}" aria-hidden="true">${i.emoji}${n ? `<span class="badge">${n}</span>` : ''}</span>
            <span class="line"><span class="nm">${esc(i.name)}</span><span class="dots"></span><span class="pr">${fmt(minor(i.price))}</span></span>
            <span class="desc">${i.soldOut ? 'Sold out today' : esc(i.desc)}</span>
          </button>`;
        }).join('')}`).join('')}
      <div class="oz"><span>ALL DRINKS 20OZ</span></div>
    </div>
    ${visitCard('Find us')}
  `;
  state.firstMenu = false;
  bindContact($('#visit') || document.createElement('div'));

  $$('[data-item]').forEach((b) => b.onclick = () => { haptic('light'); openSheet(b.dataset.item); });
  const logo = $('#logo');
  logo.onclick = () => { logo.classList.remove('intro', 'wiggle'); void logo.offsetWidth; logo.classList.add('wiggle'); haptic('medium'); };

  // Tabs scroll to category; highlight follows scroll
  $$('.tab').forEach((t) => t.onclick = () => {
    haptic('tap');
    document.getElementById('cat-' + t.dataset.cat).scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
  });
  const bar = $('#bar');
  stickObserver = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.target === logo) bar.classList.toggle('stuck', !e.isIntersecting);
      else if (e.isIntersecting) $$('.tab').forEach((t) => t.setAttribute('aria-selected', 'cat-' + t.dataset.cat === e.target.id));
    }
  }, { rootMargin: '-70px 0px -55% 0px' });
  stickObserver.observe(logo);
  $$('.cat-title').forEach((h) => stickObserver.observe(h));

  backButton(null);
  updateCartButton();
}
function updateCartButton() {
  const n = cartCount();
  mainButton(n ? `VIEW ORDER · ${n} · ${fmt(cartTotal())}` : null, () => go('cart'));
  if (!tg && n) {
    let b = $('#devCart');
    if (!b) { $('.board').insertAdjacentHTML('afterend', '<div class="actions"><button class="btn dark" id="devCart"></button></div>'); b = $('#devCart'); b.onclick = () => go('cart'); }
    b.textContent = `View order · ${n} · ${fmt(cartTotal())}`;
  }
}

function openSheet(id) {
  const item = itemById(id);
  const groups = state.menu.optionGroups;
  const sel = Object.fromEntries(item.options.map((g) => [g, groups[g].default]));
  let qty = 1;
  const sheet = $('#sheet'), scrim = $('#scrim');
  const burstColor = catClass(item.category) === 'matcha' ? BRAND.mustard : '#7a4a26';

  sheet.innerHTML = `
    <div class="grabber"></div>
    <div class="sheet-hero">${burst(burstColor)}<span class="big" aria-hidden="true">${item.emoji}</span></div>
    <h2>${esc(item.name)}</h2>
    <div class="sub">${esc(item.desc)} · 20oz · ${fmt(minor(item.price))}</div>
    <div id="opts"></div>
    <div class="qty-line"><strong>Quantity</strong>
      <span class="stepper"><button data-q="-1" aria-label="Fewer">−</button><span id="qty">1</span><button data-q="1" aria-label="More">+</button></span>
    </div>
    ${tg ? '' : '<div style="margin-top:20px"><button class="btn dark" id="addBtn"></button></div>'}`;

  const drawOptions = () => {
    $('#opts', sheet).innerHTML = activeGroups(item, sel).map((g) => `
      <div class="opt-group"><h3>${esc(groups[g].label)}</h3><div class="chips">
        ${groups[g].choices.map((c) => `<button class="chip" data-g="${g}" data-c="${c.id}" aria-pressed="${sel[g] === c.id}">
          ${esc(c.label)}${c.add ? ` +${fmt(minor(c.add))}` : ''}</button>`).join('')}
      </div></div>`).join('');
    $$('.chip', sheet).forEach((b) => b.onclick = () => {
      const changedTemp = b.dataset.g === 'temp' && sel.temp !== b.dataset.c;
      sel[b.dataset.g] = b.dataset.c; haptic('tap');
      if (changedTemp) drawOptions(); // shows/hides the ice choice
      else $$(`.chip[data-g="${b.dataset.g}"]`, sheet).forEach((x) => x.setAttribute('aria-pressed', x === b));
      updateLabel();
    });
  };
  const updateLabel = () => {
    const label = `ADD TO ORDER · ${fmt(unitPrice(item, sel) * qty)}`;
    mainButton(label, add);
    if ($('#addBtn')) $('#addBtn').textContent = label;
  };
  $$('[data-q]', sheet).forEach((b) => b.onclick = () => {
    const next = Math.max(1, Math.min(20, qty + +b.dataset.q));
    if (next === qty) return;
    qty = next; haptic('tap');
    const q = $('#qty'); q.textContent = qty; q.classList.remove('bump'); void q.offsetWidth; q.classList.add('bump');
    updateLabel();
  });

  const close = (added) => {
    sheet.classList.remove('show'); scrim.classList.remove('show');
    unlockScroll();
    sheetHideTimer = setTimeout(() => { sheet.classList.add('hidden'); scrim.classList.add('hidden'); }, 380);
    backButton(null);
    if (added) {
      const n = state.cart.filter((l) => l.id === id).reduce((s, l) => s + l.qty, 0);
      const row = $(`[data-item="${id}"]`);
      const ico = $('.ico', row);
      let badge = $('.badge', ico);
      if (!badge) { ico.insertAdjacentHTML('beforeend', '<span class="badge"></span>'); badge = $('.badge', ico); }
      badge.textContent = n;
      if (!reduceMotion) {
        badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
        row.insertAdjacentHTML('beforeend', `<span class="plus-one">+${added}</span>`);
        setTimeout(() => $('.plus-one', row)?.remove(), 800);
      }
    }
    updateCartButton();
  };
  const add = () => { addToCart(item.id, { ...sel }, qty); haptic('success'); close(qty); };

  clearTimeout(sheetHideTimer);
  drawOptions(); updateLabel();
  $('#addBtn')?.addEventListener('click', add);
  sheet.classList.remove('hidden'); scrim.classList.remove('hidden'); lockScroll(); sheet.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('show'); scrim.classList.add('show'); }));
  scrim.onclick = () => close(0);
  backButton(() => close(0));
}

// ---------- Cart ----------
function renderCart() {
  backButton(() => go('menu'));
  if (!state.cart.length) {
    $('#app').innerHTML = `<h1 class="page-title">Your order</h1>
      <div class="empty"><img src="/logo-small.webp" alt="" /><p>Your cup is empty. Pick something from the menu.</p>
      <div class="actions"><button class="btn primary" id="toMenu">See the menu</button></div></div>`;
    $('#toMenu').onclick = () => go('menu');
    mainButton(null);
    return;
  }
  $('#app').innerHTML = `
    <h1 class="page-title">Your order</h1>
    <div class="board">
      ${state.cart.map((l, idx) => {
        const it = itemById(l.id);
        return `<div class="cart-line" data-line="${idx}">
          <span class="ico ${catClass(it.category)}" aria-hidden="true">${it.emoji}</span>
          <div style="min-width:0"><div class="nm">${esc(it.name)}</div>
            <div class="opts">${esc(optionSummary(it, l.options) || '20oz')}</div>
            <div class="pr">${fmt(unitPrice(it, l.options) * l.qty)}</div></div>
          <span class="stepper"><button data-i="${idx}" data-d="-1" aria-label="Remove one">−</button><span>${l.qty}</span><button data-i="${idx}" data-d="1" aria-label="Add one">+</button></span>
        </div>`;
      }).join('')}
    </div>
    <textarea class="note" id="note" maxlength="200" placeholder="Note for the barista (optional), e.g. “less sweet” or “I’ll pick up at 8:30”">${esc(state.note)}</textarea>
    <div class="total-line"><span>Total</span><span id="total">${fmt(cartTotal())}</span></div>
    ${!tg ? '<div class="actions"><button class="btn dark" id="payBtn">Pay with KHQR</button></div>' : ''}
  `;
  $('#note').oninput = (e) => state.note = e.target.value;
  $$('[data-d]').forEach((b) => b.onclick = () => {
    const i = +b.dataset.i, l = state.cart[i];
    haptic('tap');
    if (l.qty + +b.dataset.d <= 0) {
      const el = $(`[data-line="${i}"]`);
      el.classList.add('out');
      setTimeout(() => { state.cart.splice(i, 1); renderCart(); }, reduceMotion ? 0 : 240);
      return;
    }
    l.qty += +b.dataset.d; renderCart();
  });
  const label = state.menu.open ? `PAY ${fmt(cartTotal())} WITH KHQR` : 'SHOP IS CLOSED';
  mainButton(label, placeOrder, { enabled: state.menu.open });
  $('#payBtn')?.addEventListener('click', placeOrder);
}

async function placeOrder() {
  if (!state.menu.open) return;
  if (tg && tg.initDataUnsafe?.user && !tg.initDataUnsafe.user.allows_write_to_pm && tg.isVersionAtLeast?.('6.9')) {
    await new Promise((r) => tg.requestWriteAccess(() => r()));
  }
  tg?.MainButton.showProgress();
  try {
    state.order = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({ items: state.cart.map(({ id, qty, options }) => ({ id, qty, options })), note: state.note }),
    });
    haptic('medium');
    go('pay');
  } catch (e) {
    haptic('error'); toast(e.message);
    if (/sold out|menu/i.test(e.message)) state.menu = await api('/api/menu');
  } finally {
    tg?.MainButton.hideProgress();
  }
}

// ---------- Pay ----------
function renderPay() {
  if (state.order.mode === 'manual') return renderManualPay();
  const o = state.order;
  mainButton(null);
  backButton(null);
  $('#app').innerHTML = `
    <div class="pay-wrap">
      <div class="khqr-stage">
        <div class="khqr" id="khqr" role="img" aria-label="KHQR: pay ${esc(o.total)} to ${esc(o.merchant)}">
          <div class="khqr-top">
            <img src="/khqr-logo.svg" alt="KHQR" onerror="this.outerHTML='<span class=&quot;khqr-word&quot;>KHQR</span>'" />
          </div>
          <div class="khqr-info">
            <div class="khqr-name">${esc(o.merchant)}</div>
            <div class="khqr-amount">${o.currency === 'USD' ? o.amount.toFixed(2) : o.amount.toLocaleString('en-US')}<small>${o.currency}</small></div>
          </div>
          <div class="khqr-sep"></div>
          <div class="khqr-qr"><div class="q">
            <img class="code" src="${o.qrUrl}" alt="" />
            <span class="mark" aria-hidden="true">${o.currency === 'USD' ? '$' : '៛'}</span>
          </div></div>
          <div class="khqr-expired-label">QR expired</div>
        </div>
      </div>
      <div class="timer" id="timer"></div>
      <div class="waiting" id="waiting"><img src="/logo-small.webp" alt="" />Waiting for your payment…</div>
      <div class="pay-actions" id="actions">
        ${o.deeplink ? `<button class="btn primary" id="openBank">Open my banking app</button>` : ''}
        <button class="btn ${o.deeplink ? '' : 'primary'}" id="saveQr">Save QR to photos</button>
        <button class="btn ghost" id="cancel">Cancel order</button>
      </div>
      <p class="hint">Paying from this phone? Save the QR, then choose “scan from gallery” in ABA, ACLEDA, Wing or any Bakong app.</p>
      <button class="help-link" id="help">Paid but stuck? Get help</button>
    </div>`;

  $('#openBank')?.addEventListener('click', () => tg ? tg.openLink(o.deeplink) : window.open(o.deeplink));
  $('#saveQr').onclick = () => {
    const url = location.origin + (o.cardUrl || o.qrUrl); // full KHQR card, not just the code
    if (tg?.isVersionAtLeast?.('8.0')) tg.downloadFile({ url, file_name: `KHQR-kafee-${o.id}.png` });
    else if (tg) tg.openLink(url);
    else window.open(url);
  };
  $('#cancel').onclick = () => cancelOrder('Cancel this order? Don’t cancel if you’ve already paid.');
  $('#help').onclick = () => openSupport(o);

  const tick = () => {
    const left = Math.max(0, o.expiresAt - Date.now());
    const mm = Math.floor(left / 60000), ss = String(Math.floor(left / 1000) % 60).padStart(2, '0');
    const t = $('#timer'); if (!t) return;
    t.textContent = left ? `QR expires in ${mm}:${ss}` : 'This QR has expired';
    t.classList.toggle('low', left > 0 && left < 60000);
    if (!left) showExpired();
  };
  tick(); tickTimer = setInterval(tick, 1000);
  pollTimer = setInterval(pollOrder, 3000);
}

// ---------- Manual payment: your own ABA / KHQR merchant QR ----------
const amountText = (o) => o.currency === 'USD' ? o.amount.toFixed(2) : o.amount.toLocaleString('en-US');
function renderManualPay() {
  const o = state.order;
  backButton(null);
  if (o.status === 'awaiting_confirmation') {
    mainButton(null);
    $('#app').innerHTML = `
      <div class="checking">
        <img src="/logo-small.webp" alt="" />
        <h2>Checking your payment</h2>
        <p>The barista is confirming your payment in the bank app. This usually takes under a minute.</p>
        <div class="amt">${esc(o.total)}</div>
        <button class="help-link" id="help">Taking too long? Get help</button>
        <div class="actions"><button class="btn ghost" id="cancelWait">Cancel order (only if you didn’t pay)</button></div>
      </div>`;
    $('#cancelWait').onclick = () => cancelOrder('Cancel this order? Only cancel if you did NOT pay.');
    $('#help').onclick = () => openSupport(o);
    pollTimer = setInterval(pollOrder, 3000);
    return;
  }

  const money = o.currency === 'USD' ? '$' + amountText(o) : amountText(o) + '៛';
  $('#app').innerHTML = `
    <div class="pay-wrap">
      ${o.rejectedCount ? `<div class="warn">We couldn’t find your payment yet. Check your bank app shows <u>${esc(money)}</u> paid to ${esc(o.merchant)}, then tap “I’ve paid” again.</div>` : ''}
      <div class="pay-amount">
        <div class="lbl">PAY EXACTLY</div>
        <div class="big">${esc(money)}</div><br>
        <button class="copy" id="copyAmt">Copy amount</button>
      </div>
      <div class="khqr-stage">
        <div class="khqr static" id="khqr" role="img" aria-label="KHQR for ${esc(o.merchant)}">
          <div class="khqr-top">
            <img src="/khqr-logo.svg" alt="KHQR" onerror="this.outerHTML='<span class=&quot;khqr-word&quot;>KHQR</span>'" />
          </div>
          <div class="khqr-info"><div class="khqr-name">${esc(o.merchant)}</div></div>
          <div class="khqr-sep"></div>
          <div class="khqr-qr"><div class="q">
            <img class="code" src="${o.qrUrl}" alt="" />
            <span class="mark" aria-hidden="true">${o.qrCurrency === 'KHR' ? '៛' : '$'}</span>
          </div></div>
          <div class="khqr-expired-label">Time’s up</div>
        </div>
      </div>
      <ol class="pay-steps">
        <li>Scan this QR, or save it and scan from gallery</li>
        <li>Type ${esc(money)} in your bank app and pay</li>
        <li>Come back and tap “I’ve paid”</li>
      </ol>
      <div class="timer" id="timer"></div>
      <div class="pay-actions" id="actions">
        ${!tg ? `<button class="btn dark" id="paidBtn">I’ve paid ${esc(money)}</button>` : ''}
        <button class="btn" id="saveQr">Save QR to photos</button>
        <button class="btn ghost" id="cancel">Cancel order</button>
      </div>
      <button class="help-link" id="help">Paid but stuck? Get help</button>
    </div>`;
  $('#help').onclick = () => openSupport(o);

  const claim = async () => {
    const ok = await new Promise((r) => tg?.showConfirm
      ? tg.showConfirm(`Did you pay ${money} to ${o.merchant}?`, r)
      : r(confirm(`Did you pay ${money}?`)));
    if (!ok) return;
    tg?.MainButton.showProgress();
    try {
      state.order = await api(`/api/orders/${o.id}/claim-paid`, { method: 'POST' });
      haptic('medium');
      go('pay', 'up');
    } catch (e) { toast(e.message); }
    finally { tg?.MainButton.hideProgress(); }
  };
  mainButton(`I’VE PAID ${money}`, claim);
  $('#paidBtn')?.addEventListener('click', claim);
  $('#copyAmt').onclick = async () => {
    try { await navigator.clipboard.writeText(amountText(o).replace(/,/g, '')); toast('Amount copied'); haptic('light'); }
    catch { toast(`Type ${money} in your bank app`); }
  };
  $('#saveQr').onclick = () => {
    const url = location.origin + (o.cardUrl || o.qrUrl); // full KHQR card, not just the code
    if (tg?.isVersionAtLeast?.('8.0')) tg.downloadFile({ url, file_name: `KHQR-kafee-${o.id}.png` });
    else if (tg) tg.openLink(url);
    else window.open(url);
  };
  $('#cancel').onclick = () => cancelOrder('Cancel this order? Don’t cancel if you’ve already paid. Tap “I’ve paid” instead.');

  const tick = () => {
    const left = Math.max(0, o.expiresAt - Date.now());
    const mm = Math.floor(left / 60000), ss = String(Math.floor(left / 1000) % 60).padStart(2, '0');
    const t = $('#timer'); if (!t) return;
    t.textContent = left ? `Pay within ${mm}:${ss}` : 'Time’s up for this order';
    t.classList.toggle('low', left > 0 && left < 60000);
    if (!left) showExpired();
  };
  tick(); tickTimer = setInterval(tick, 1000);
  pollTimer = setInterval(pollOrder, 5000);
}

async function cancelOrder(question) {
  const ok = await new Promise((r) => tg?.showConfirm ? tg.showConfirm(question, r) : r(confirm(question)));
  if (!ok) return;
  try { state.order = await api(`/api/orders/${state.order.id}/cancel`, { method: 'POST' }); }
  catch (e) { return toast(e.message); }
  if (state.order.status === 'cancelled') { toast('Order cancelled'); go('cart', 'back'); }
  else go('status'); // the payment had already arrived
}

function showExpired() {
  clearInterval(tickTimer);
  $('#khqr')?.classList.add('expired');
  $('#waiting')?.classList.add('hidden');
  const manual = state.order.mode === 'manual';
  if (manual) mainButton(null);
  $('#actions').innerHTML = `${manual ? '<button class="btn dark" id="paidLate">I already paid</button>' : ''}<button class="btn primary" id="regen">${manual ? 'I still want to order' : 'Get a new QR'}</button><button class="btn ghost" id="cancel2">Cancel order</button>`;
  $('#paidLate')?.addEventListener('click', async () => {
    try { state.order = await api(`/api/orders/${state.order.id}/claim-paid`, { method: 'POST' }); go('pay', 'up'); }
    catch (e) { toast(e.message); }
  });
  $('#regen').onclick = async () => {
    try { state.order = await api(`/api/orders/${state.order.id}/regenerate`, { method: 'POST' }); haptic('light'); go(state.order.status === 'pending_payment' ? 'pay' : 'status', 'up'); }
    catch (e) { toast(e.message); }
  };
  $('#cancel2').onclick = () => cancelOrder('Cancel this order?');
}

async function pollOrder() {
  try {
    const prev = state.order.status;
    const o = await api(`/api/orders/${state.order.id}`);
    state.order = o;
    if (state.view === 'pay' && !['pending_payment', 'expired', 'awaiting_confirmation', 'cancelled'].includes(o.status)) {
      haptic('success'); state.cart = []; state.note = '';
      go('status', 'up'); celebrate();
    } else if (state.view === 'pay' && o.status !== prev && o.status === 'pending_payment') {
      haptic('warning'); go('pay', 'up'); // barista couldn't find the payment
    } else if (state.view === 'status' && o.status !== prev) {
      if (o.status === 'ready') haptic('success');
      renderStatus(prev);
    }
  } catch {}
}

// ---------- Status / pickup ticket ----------
const FLOW = [['paid', 'Payment received'], ['preparing', 'Making your drinks'], ['ready', 'Ready at the counter'], ['picked_up', 'Picked up']];
function renderStatus(prevStatus) {
  const o = state.order;
  const idx = FLOW.findIndex(([s]) => s === o.status);
  const prevIdx = FLOW.findIndex(([s]) => s === prevStatus);
  const msg = { paid: 'You’re in the queue', preparing: 'Your drinks are being made', ready: 'Come and get it!', picked_up: 'Enjoy your Kafee' }[o.status] || '';
  const isDone = (i) => i === 0 || i < idx || (i === idx && o.status === 'picked_up'); // payment is done the moment we're here
  $('#app').innerHTML = `
    <div class="ticket-wrap" id="tw">
      ${burst(o.status === 'ready' ? '#5d7f2c' : BRAND.espresso, 18)}
      <div class="ticket">
        <div class="label">PICKUP NO.</div>
        <div class="code">${esc(o.code || '—')}</div>
        <div class="sub">${esc(msg)}</div>
      </div>
    </div>
    ${o.status === 'ready' ? '<div class="ready-banner">YOUR ORDER IS READY!</div>' : ''}
    <ol class="steps">
      ${FLOW.map(([s, label], i) => `<li class="${isDone(i) ? 'done' : i === idx ? 'now' : ''} ${isDone(i) && prevIdx >= 0 && i >= prevIdx && i > 0 ? 'fresh' : ''}">
        <span class="mark">${isDone(i) ? '✓' : ''}</span>${label}</li>`).join('')}
    </ol>
    <div class="receipt">
      ${o.items.map((it) => `<div><span>${it.qty}× ${esc(it.name)}${Object.keys(it.options).length ? `<br><small>${esc(Object.values(it.options).join(', '))}</small>` : ''}</span><span>${esc(it.subtotal)}</span></div>`).join('')}
      ${o.note ? `<div><small>Note: ${esc(o.note)}</small></div>` : ''}
      <div class="t"><span>PAID WITH KHQR</span><span>${esc(o.total)}</span></div>
    </div>
    ${['picked_up', 'ready'].includes(o.status) ? '' : '<p class="hint">We’ll also message you on Telegram when it’s ready.</p>'}
    ${o.status === 'picked_up' ? '' : visitCard('Pick up at', { hours: false })}
    <button class="help-link" id="help">Something wrong with your order? Get help</button>
    ${!tg && ['picked_up', 'ready'].includes(o.status) ? '<div class="actions"><button class="btn primary" id="again">Order something else</button></div>' : ''}
  `;
  const svg = $('#tw svg');
  if (!reduceMotion) {
    if (prevStatus && prevStatus !== o.status) { $('#tw').classList.add('pop'); }
    else svg.classList.add('spin');
  }
  if ($('#visit')) bindContact($('#visit'));
  $('#help').onclick = () => openSupport(o);
  const again = async () => { state.order = null; state.menu = await api('/api/menu'); go('menu', 'back'); };
  $('#again')?.addEventListener('click', again);
  backButton(null);
  mainButton(['picked_up', 'ready'].includes(o.status) ? 'ORDER SOMETHING ELSE' : null, again);
  if (!['picked_up', 'cancelled'].includes(o.status) && !pollTimer) pollTimer = setInterval(pollOrder, 5000);
}

function celebrate() {
  if (reduceMotion) return;
  $('#tw')?.classList.add('pop');
  $('#tw svg')?.classList.remove('spin');
}

// ---------- Find us, contact & help ----------
const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_NAMES = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
const shopInfo = () => state.menu?.shop || {};
const hasMap = (s) => s.lat != null && s.lng != null;
function todayKey(s) {
  try { return new Intl.DateTimeFormat('en-US', { timeZone: s.timezone, weekday: 'short' }).format(new Date()).toLowerCase().slice(0, 3); }
  catch { return DAY_KEYS[(new Date().getDay() + 6) % 7]; }
}
function directionsUrl(s) {
  return s.mapsUrl || (hasMap(s) ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}` : '');
}
function mapHtml(s) {
  if (!hasMap(s)) return '';
  const d = 0.004, e = 0.0025;
  const src = `https://www.openstreetmap.org/export/embed.html?bbox=${s.lng - d},${s.lat - e},${s.lng + d},${s.lat + e}&layer=mapnik&marker=${s.lat},${s.lng}`;
  return `<button class="map" data-act="dir" aria-label="Open directions"><iframe src="${src}" loading="lazy" tabindex="-1" title="Map"></iframe><span>DIRECTIONS</span></button>`;
}
function contactButtons(s, { directions = true } = {}) {
  const b = [];
  if (directions && directionsUrl(s)) b.push('<button class="btn primary" data-act="dir">📍 Directions</button>');
  if (s.phone) b.push('<button class="btn" data-act="call">📞 Call</button>');
  if (s.telegram) b.push('<button class="btn" data-act="msg">💬 Chat</button>');
  return b.length ? `<div class="contact-row">${b.join('')}</div>` : '';
}
function bindContact(root) {
  const s = shopInfo();
  $$('[data-act]', root).forEach((el) => el.onclick = () => {
    haptic('light');
    const act = el.dataset.act;
    if (act === 'dir') { const u = directionsUrl(s); tg ? tg.openLink(u) : window.open(u); }
    if (act === 'call') {
      navigator.clipboard?.writeText(s.phone).catch(() => {});
      toast(`Calling ${s.phone} (number copied)`);
      if (tg) tg.openLink(location.origin + '/call'); // opens the phone's browser, which starts the call
      else window.location.href = 'tel:' + s.phone.replace(/[^\d+]/g, '');
    }
    if (act === 'msg') { const u = `https://t.me/${s.telegram}`; tg ? tg.openTelegramLink(u) : window.open(u); }
  });
}
const to12h = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const hoursText = (h) => (h ? `${to12h(h[0])} – ${to12h(h[1])}` : 'Closed');
function visitCard(title, { hours = true } = {}) {
  const s = shopInfo();
  const days = DAY_KEYS.filter((k) => k in (s.hours || {}));
  const today = todayKey(s);
  const sameEveryDay = days.length === 7 && days.every((k) => JSON.stringify(s.hours[k]) === JSON.stringify(s.hours.mon));
  const hoursHtml = !hours || days.length === 0 ? '' : sameEveryDay
    ? `<div class="hours"><span class="today">Every day</span><span class="today">${hoursText(s.hours.mon)}</span></div>`
    : `<div class="hours">${days.map((k) => {
      const cls = k === today ? 'today' : '';
      return `<span class="${cls}">${DAY_NAMES[k]}</span><span class="${cls}">${hoursText(s.hours[k])}</span>`;
    }).join('')}</div>`;
  const body = hoursHtml + (s.address ? `<p class="addr">${esc(s.address)}</p>` : '') + mapHtml(s) + contactButtons(s);
  return body ? `<section class="visit" id="visit"><h2>${title}</h2>${body}</section>` : '';
}

// Bottom panel (reuses the item sheet). Restores the Telegram buttons when closed.
function openPanel(inner, mount) {
  const sheet = $('#sheet'), scrim = $('#scrim');
  const saved = { main: mainHandler && tg ? { text: tg.MainButton.text, handler: mainHandler, enabled: tg.MainButton.isActive } : null, back: backHandler };
  mainButton(null);
  clearTimeout(sheetHideTimer);
  sheet.innerHTML = `<div class="grabber"></div>${inner}`;
  sheet.classList.remove('hidden'); scrim.classList.remove('hidden'); lockScroll(); sheet.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('show'); scrim.classList.add('show'); }));
  const close = () => {
    sheet.classList.remove('show'); scrim.classList.remove('show');
    unlockScroll();
    sheetHideTimer = setTimeout(() => { sheet.classList.add('hidden'); scrim.classList.add('hidden'); }, 380);
    backButton(saved.back);
    if (saved.main) mainButton(saved.main.text, saved.main.handler, { enabled: saved.main.enabled });
  };
  scrim.onclick = close;
  backButton(close);
  mount?.(sheet, close);
}

function openSupport(order) {
  const s = shopInfo();
  const chat = s.telegram ? `<div style="margin-top:14px"><button class="btn primary" data-act="msg">💬 Chat with the barista on Telegram</button></div>` : '';
  const contacts = contactButtons({ ...s, telegram: '' }); // Directions + Call; chat is the big button above
  const where = s.address ? `<p class="addr" style="text-align:center">📍 ${esc(s.address)}</p>` : '';
  openPanel(`
    <h2 class="panel-title">Need help?</h2>
    <p class="panel-sub">${s.telegram ? 'Message us on Telegram and a barista will reply.' : 'Tell the barista what went wrong.'}</p>
    ${chat}
    ${contacts}
    ${where}
    ${order ? `
      <h3 class="panel-h3">Report a problem with this order</h3>
      <textarea class="note" id="reportMsg" maxlength="500" placeholder="e.g. I paid ${esc(order.total)} but the app still says checking"></textarea>
      <div style="margin-top:14px"><button class="btn dark" id="sendReport">Send to the barista</button></div>` : ''}
  `, (sheet, close) => {
    bindContact(sheet);
    $('#sendReport', sheet)?.addEventListener('click', async () => {
      const message = $('#reportMsg', sheet).value.trim();
      if (message.length < 2) return toast('Please write what went wrong.');
      try {
        await api(`/api/orders/${order.id}/report`, { method: 'POST', body: JSON.stringify({ message }) });
        haptic('success'); toast('Sent. A barista will get back to you.'); close();
      } catch (e) { haptic('error'); toast(e.message); }
    });
  });
}

// ---------- Boot ----------
(async () => {
  const started = Date.now();
  try {
    state.menu = await api('/api/menu');
    let active = null;
    if (tg?.initData || !tg) active = await api('/api/orders/active').catch(() => null);
    // let the splash land before switching
    await new Promise((r) => setTimeout(r, Math.max(0, (reduceMotion ? 0 : 700) - (Date.now() - started))));
    if (active) { state.order = active; return go(['pending_payment', 'awaiting_confirmation'].includes(active.status) ? 'pay' : 'status', 'up'); }
    go('menu', 'up');
  } catch (e) {
    $('#app').innerHTML = `<div class="empty"><img src="/logo-small.webp" alt="" /><p>${esc(e.message)}</p>
      <div class="actions"><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`;
  }
})();
</script>
